<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ForgeMind AI v2 neural network illustration">
  <defs>
    <radialGradient id="bgGlow" cx="72%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#123a5e" />
      <stop offset="45%" stop-color="#081c30" />
      <stop offset="100%" stop-color="#020a14" />
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3fa9e0" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#9fddff" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#ffc46e" stop-opacity="0.35" />
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf8ff" />
      <stop offset="55%" stop-color="#9fddff" />
      <stop offset="100%" stop-color="#9fddff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7e8" />
      <stop offset="35%" stop-color="#ffc46e" />
      <stop offset="100%" stop-color="#ffc46e" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGlow)" />

  <g opacity="0.10" stroke="#9fddff" stroke-width="1">
    <path d="M0 100 H1200 M0 220 H1200 M0 340 H1200 M0 460 H1200 M0 580 H1200 M0 700 H1200" />
    <path d="M100 0 V800 M280 0 V800 M460 0 V800 M640 0 V800 M820 0 V800 M1000 0 V800" />
  </g>

  <!-- layer columns: input (x=330), hidden (x=650), output/core (x=940) -->
  <g stroke="url(#lineGrad)" stroke-width="1.4" fill="none" opacity="0.75">
    <path d="M330 190 L650 250" /><path d="M330 190 L650 400" /><path d="M330 190 L650 560" />
    <path d="M330 330 L650 250" /><path d="M330 330 L650 400" /><path d="M330 330 L650 560" />
    <path d="M330 470 L650 250" /><path d="M330 470 L650 400" /><path d="M330 470 L650 560" />
    <path d="M330 610 L650 250" /><path d="M330 610 L650 400" /><path d="M330 610 L650 560" />
    <path d="M650 250 L940 400" /><path d="M650 400 L940 400" /><path d="M650 560 L940 400" />
  </g>

  <!-- input layer nodes -->
  <g>
    <circle cx="330" cy="190" r="26" fill="url(#nodeGlow)" filter="url(#soft)" />
    <circle cx="330" cy="330" r="26" fill="url(#nodeGlow)" filter="url(#soft)" />
    <circle cx="330" cy="470" r="26" fill="url(#nodeGlow)" filter="url(#soft)" />
    <circle cx="330" cy="610" r="26" fill="url(#nodeGlow)" filter="url(#soft)" />
    <circle cx="330" cy="190" r="6" fill="#eaf8ff" />
    <circle cx="330" cy="330" r="6" fill="#eaf8ff" />
    <circle cx="330" cy="470" r="6" fill="#eaf8ff" />
    <circle cx="330" cy="610" r="6" fill="#eaf8ff" />
  </g>

  <!-- hidden layer nodes -->
  <g>
    <circle cx="650" cy="250" r="30" fill="url(#nodeGlow)" filter="url(#soft)" />
    <circle cx="650" cy="400" r="30" fill="url(#nodeGlow)" filter="url(#soft)" />
    <circle cx="650" cy="560" r="30" fill="url(#nodeGlow)" filter="url(#soft)" />
    <circle cx="650" cy="250" r="7" fill="#eaf8ff" />
    <circle cx="650" cy="400" r="7" fill="#eaf8ff" />
    <circle cx="650" cy="560" r="7" fill="#eaf8ff" />
  </g>

  <!-- output / core node -->
  <circle cx="940" cy="400" r="70" fill="url(#coreGlow)" filter="url(#soft)" />
  <circle cx="940" cy="400" r="14" fill="#fff7e8" />
  <circle cx="940" cy="400" r="96" fill="none" stroke="#ffc46e" stroke-opacity="0.35" stroke-width="1.5" />
  <circle cx="940" cy="400" r="128" fill="none" stroke="#ffc46e" stroke-opacity="0.18" stroke-width="1" />

  <!-- token / data pulses -->
  <g fill="#9fddff">
    <circle cx="470" cy="238" r="3.5" opacity="0.9" />
    <circle cx="520" cy="470" r="3" opacity="0.7" />
    <circle cx="790" cy="330" r="3.5" opacity="0.9" />
    <circle cx="800" cy="470" r="3" opacity="0.6" />
  </g>

  <text x="64" y="720" font-family="Roboto, sans-serif" font-size="30" letter-spacing="4" fill="#eaf8ff" opacity="0.9">FORGEMIND AI</text>
  <text x="64" y="752" font-family="Roboto, sans-serif" font-size="16" letter-spacing="3" fill="#9fddff" opacity="0.7">TRANSFORMER · TOKENIZER · INFERENCE ENGINE</text>
</svg>
